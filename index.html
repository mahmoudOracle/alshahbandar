    <style>
      /* Print Styles */
      @media print {
        body * {
          visibility: hidden;
        }
        #printable-invoice,
        #printable-invoice * {
          visibility: visible;
        }
        #printable-invoice {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
        }
      }

      /* Page transition animation */
      .page-transition {
        animation: fadeInSlideUp 0.4s ease-out forwards;
      }
      @keyframes fadeInSlideUp {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
