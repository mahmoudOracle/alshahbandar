name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --run

  integration:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: npm ci
      - name: Install Firebase Tools
        run: npm ci -g firebase-tools || npm i -g firebase-tools
      - name: Setup Java 21 (required by firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Install wait-on
        run: npm install -g wait-on

      - name: Start Firebase Emulators
        env:
          FIREBASE_PROJECT: al-shabandar
        run: |
          npx firebase emulators:start --only firestore,functions --project "$FIREBASE_PROJECT" --host 0.0.0.0 &> emulators.log &
          echo "Waiting for emulators to be ready..."
          npx wait-on -t 120000 tcp:8080 tcp:5001
          echo "Emulators ready"
      - name: Run integration tests
        env:
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FUNCTIONS_EMULATOR_HOST: localhost:5001
        run: npm run test:integration

  e2e:
    runs-on: ubuntu-latest
    needs: [integration]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Setup Java 21 (required by firebase emulators)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Build app
        run: npm run build
      - name: Start Vite preview and Firebase emulators
        env:
          FIREBASE_PROJECT: al-shabandar
        run: |
          # start preview server
          nohup npm run preview &> preview.log &
          # start emulators in background
          npx firebase emulators:start --only firestore,functions --project "$FIREBASE_PROJECT" --host 0.0.0.0 &> emulators.log &
          # wait for preview and emulators
          npx wait-on -t 120000 http://localhost:5173 tcp:8080 tcp:5001
      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:5173
          FIRESTORE_EMULATOR_HOST: localhost:8080
          FUNCTIONS_EMULATOR_HOST: localhost:5001
        run: npm run test:e2e

  # Optional emulator-based integration job (commented; enable when integration tests present)
