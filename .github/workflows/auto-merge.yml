name: Auto Merge On Green

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'phase4-') }}
    runs-on: ubuntu-latest
    steps:
      - name: Find and merge PR
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const head = context.payload.workflow_run.head_branch;
            console.log(`Workflow succeeded for branch: ${head}`);
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              head: `${context.repo.owner}:${head}`,
              state: 'open'
            });
            if (!prs || prs.length === 0) {
              console.log(`No open PR found for branch ${head}`);
              return;
            }
            const pr = prs[0];
            console.log(`Merging PR #${pr.number} ("${pr.title}") into ${pr.base.ref}`);
            await github.rest.pulls.merge({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              merge_method: 'squash'
            });
            console.log(`Merged PR #${pr.number} from ${head}`);
